<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safety | Portal Login</title>
  <meta name="description" content="Log in to the Safety student and coordinator portal to track certifications, access digital modules, and view course schedules.">
  <link class="fav" rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            creamWhite: '#FFFFFF',
            sage: '#EF4444',
            meadow: '#DC2626',
            honey: '#EF4444',
            cheese: '#EF4444',
            orange: '#DC2626',
            forest: '#0F172A',
            brown: '#1E293B',
            softBeige: '#F8FAFC',
            headingDark: '#0F172A',
            bodyDark: '#334155',
            mutedDark: '#64748B',
          },
          fontFamily: {
            playfair: ['Playfair Display', 'serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom CSS & FontAwesome & AOS -->
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css">
</head>
<body class="bg-creamWhite text-bodyDark dark:bg-[#111612] dark:text-[#E2E8F0] min-h-screen flex flex-col justify-between relative overflow-x-clip font-inter">
  
  <!-- Floating Background Shapes -->
  <div class="floating-shape top-24 left-10 text-cheese opacity-20">
    <i class="fa-solid fa-helmet-safety text-8xl"></i>
  </div>
  <div class="floating-shape bottom-24 right-10 text-sage opacity-20 floating-shape-delay-1">
    <i class="fa-solid fa-shield-halved text-8xl"></i>
  </div>

  <!-- Header with toggles only -->
  <header class="w-full py-6 px-4 sm:px-8 z-10 flex justify-end items-center">
    <div class="flex items-center space-x-3 rtl:space-x-reverse">
      <!-- Theme Toggle -->
      <button class="theme-toggle w-9 h-9 flex items-center justify-center rounded-lg border border-sage/20 hover:bg-softBeige dark:hover:bg-forest/20 text-forest dark:text-creamWhite transition-all" aria-label="Toggle Theme">
        <i class="fa-solid fa-sun dark:hidden"></i>
        <i class="fa-solid fa-moon hidden dark:block"></i>
      </button>
      
      <!-- RTL Toggle -->
      <button class="rtl-toggle w-9 h-9 flex items-center justify-center rounded-lg border border-sage/20 hover:bg-softBeige dark:hover:bg-forest/20 text-forest dark:text-creamWhite transition-all" aria-label="Toggle Layout Direction">
        <i class="fa-solid fa-right-left rtl-flip"></i>
      </button>
    </div>
  </header>

  <!-- Login Card container (Centered) -->
  <main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12 z-10 font-inter">
    <div class="max-w-md w-full bg-white/70 dark:bg-black/60 backdrop-blur-md rounded-3xl p-8 md:p-10 border border-white/20 dark:border-white/10 shadow-2xl" data-aos="zoom-in">
      <div class="text-center mb-8">
        <!-- Brand Logo and Name -->
        <a href="index.html" class="flex items-center justify-center space-x-3 rtl:space-x-reverse mb-6 group cursor-pointer font-inter">
          <div class="w-12 h-12 bg-forest dark:bg-sage rounded-xl flex items-center justify-center shadow-lg transition-transform group-hover:scale-105">
            <i class="fa-solid fa-shield-halved text-creamWhite dark:text-forest text-2xl"></i>
          </div>
          <div class="flex flex-col text-left rtl:text-right font-inter">
            <span class="font-playfair font-bold text-2xl text-headingDark dark:text-creamWhite leading-tight tracking-wide">Safety</span>
            <span class="text-[10px] tracking-widest uppercase font-inter text-sage dark:text-cheese font-semibold">Compliance Training</span>
          </div>
        </a>
        <h2 class="font-playfair font-bold text-3xl text-headingDark dark:text-creamWhite">Welcome Back</h2>
        <p class="text-xs text-mutedDark dark:text-gray-300 mt-2 font-inter">
          Log in to your dashboard to manage corporate enrollments and course completions.
        </p>
      </div>

      <form class="inquiry-form space-y-6">
        <div>
          <label class="block text-xs font-bold text-headingDark dark:text-creamWhite uppercase tracking-wider mb-2 font-inter">Email Address</label>
          <div class="relative">
            <i class="fa-regular fa-envelope absolute left-3 top-3.5 text-sage"></i>
            <input type="email" required placeholder="Enter your email address" class="w-full pl-10 pr-4 py-3 rounded-lg border border-sage/30 bg-white/80 dark:bg-[#111612]/80 text-bodyDark dark:text-creamWhite focus:outline-none focus:ring-2 focus:ring-sage font-inter text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-headingDark dark:text-creamWhite uppercase tracking-wider mb-2 font-inter">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3 top-3.5 text-sage"></i>
            <input type="password" id="login-password" required placeholder="Enter your password" class="w-full pl-10 pr-10 py-3 rounded-lg border border-sage/30 bg-white/80 dark:bg-[#111612]/80 text-bodyDark dark:text-creamWhite focus:outline-none focus:ring-2 focus:ring-sage font-inter text-sm">
            <button type="button" class="toggle-password absolute right-3 top-3.5 text-sage hover:text-forest dark:hover:text-creamWhite focus:outline-none" data-target="login-password" aria-label="Toggle Password Visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs font-inter">
          <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer">
            <input type="checkbox" class="rounded border-sage/30 text-forest focus:ring-sage h-4 w-4 bg-white/80">
            <span class="text-bodyDark dark:text-gray-300">Remember Me</span>
          </label>
          <a href="#" class="text-forest dark:text-sage font-semibold hover:text-honey transition-colors">Forgot Password?</a>
        </div>

        <button type="submit" class="bg-forest hover:bg-forest/90 dark:bg-sage dark:hover:bg-sage/90 text-creamWhite dark:text-forest font-semibold px-8 py-3.5 rounded-lg shadow-md hover:shadow-lg transition-all w-full text-sm font-inter">
          Access Portal
        </button>
      </form>

      <!-- Social Logins -->
      <div class="mt-8 border-t border-sage/20 pt-6 font-inter">
        <span class="block text-center text-xs text-mutedDark dark:text-gray-400 uppercase tracking-widest mb-4">Or Login With</span>
        <div class="grid grid-cols-2 gap-3">
          <button class="flex items-center justify-center space-x-2 rtl:space-x-reverse py-2.5 border border-sage/30 rounded-lg bg-white/80 hover:bg-white text-xs font-semibold dark:bg-[#111612]/80 dark:hover:bg-[#111612] text-bodyDark dark:text-creamWhite transition-all">
            <i class="fa-brands fa-google text-red-500"></i>
            <span>Google</span>
          </button>
          <button class="flex items-center justify-center space-x-2 rtl:space-x-reverse py-2.5 border border-sage/30 rounded-lg bg-white/80 hover:bg-white text-xs font-semibold dark:bg-[#111612]/80 dark:hover:bg-[#111612] text-bodyDark dark:text-creamWhite transition-all">
            <i class="fa-brands fa-apple text-black dark:text-white"></i>
            <span>Apple</span>
          </button>
        </div>
      </div>

      <div class="mt-8 text-center text-xs font-inter text-mutedDark dark:text-gray-300">
        New corporate coordinator? <a href="signup.html" class="text-forest dark:text-sage font-bold hover:text-honey transition-colors">Create account</a>
      </div>
    </div>
  </main>

  <!-- Small minimal Footer just for Copyright -->
  <footer class="w-full py-6 px-4 text-center z-10 text-xs text-mutedDark dark:text-gray-400">
    <p>&copy; 2026 Safety Training & Compliance. All Rights Reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script src="js/main.js"></script>
  <script>
    AOS.init({
      duration: 800,
      once: true,
      easing: 'ease-out-cubic'
    });
  </script>
</body>
</html>
